name: generate-tts

on:
  workflow_dispatch:
    inputs:
      input_json:
        description: "path to JSON file with {lang: text} pairs (in repo) OR leave blank to use texts.json"
        required: false
        default: "texts.json"
      out_dir:
        description: "output directory"
        required: false
        default: "out/route1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/batch.py --input "${{ github.event.inputs.input_json }}" --out "${{ github.event.inputs.out_dir }}"
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: tts-output
          path: ${{ github.event.inputs.out_dir }}
