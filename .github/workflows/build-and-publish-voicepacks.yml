name: build-and-publish-single-voicepacks

on:
  workflow_dispatch:
    inputs:
      speakers:
        description: "گوینده‌های TTS Neural با فاصله جدا شوند؛ نمونه: shahrzad sara"
        required: true
        default: "shahrzad"
      speed:
        description: "سرعت TTS Neural"
        required: false
        default: "1.0"
      release_tag:
        description: "تگ انتشار"
        required: false
        default: "voicepacks-latest"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore completed Neural TTS cue cache
        uses: actions/cache@v4
        with:
          path: out/.voice_build_cache
          key: neural-cues-v1-${{ inputs.speakers }}-${{ inputs.speed }}-${{ hashFiles('examples/nav_phrases.json', 'scripts/*.py') }}
      - name: Build one-file voice packs with Neural TTS
        env:
          SPEAKERS: ${{ inputs.speakers }}
          SPEED: ${{ inputs.speed }}
        run: |
          set -euo pipefail
          mkdir -p out
          for speaker in $SPEAKERS; do
            python scripts/build_single_voicepack.py \
              --input examples/nav_phrases.json \
              --out "out" \
              --speaker "$speaker" \
              --speed "$SPEED" \
              --cache-dir "out/.voice_build_cache/$speaker" \
              --download-base "https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}"
          done
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Neural Single Voice Packs
          files: |
            out/manifest.json
            out/*.abv
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
