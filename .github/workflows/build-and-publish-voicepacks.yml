name: build-and-publish-voicepacks

# دستی اجرا می‌شود: تب Actions -> این ورک‌فلو -> Run workflow
on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "مسیر فایل JSON عبارات (phrase_id -> {lang: text})"
        required: false
        default: "examples/nav_phrases.json"
      genders:
        description: "male female یا فقط یکی از آن‌ها (با فاصله جدا کنید)"
        required: false
        default: "male female"
      rate:
        description: "نرخ گفتار edge-tts، مثل +0%% یا -10%%"
        required: false
        default: "+0%"
      release_tag:
        description: "تگ ریلیزی که فایل‌ها روی آن publish می‌شوند"
        required: false
        default: "voicepacks-latest"
      skip_existing:
        description: "اگر true باشد، فایل‌های از قبل موجود دوباره ساخته نمی‌شوند"
        required: false
        default: "false"

  # اختیاری: هر بار که فایل عبارات تغییر کند هم اجرا شود
  push:
    branches: [main]
    paths:
      - "examples/nav_phrases.json"
      - "scripts/**"

permissions:
  contents: write   # برای ساخت/آپدیت Release و آپلود asset لازم است

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build voice packs (.nvb) + catalog.json
        working-directory: scripts
        run: |
          ARGS="--input ../${{ github.event.inputs.input_file || 'examples/nav_phrases.json' }} --out ../out --rate \"${{ github.event.inputs.rate || '+0%' }}\" --genders ${{ github.event.inputs.genders || 'male female' }}"
          if [ "${{ github.event.inputs.skip_existing }}" = "true" ]; then
            ARGS="$ARGS --skip-existing"
          fi
          eval python batch.py $ARGS

      - name: Show build summary
        run: |
          echo "### خلاصه ساخت voice packs" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat out/catalog.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find out -name "*.nvb" | wc -l | xargs echo "تعداد فایل‌های .nvb ساخته‌شده:"

      - name: Zip build (artifact پشتیبان برای دیباگ)
        run: |
          cd out && zip -r ../voicepacks-build.zip . && cd ..

      - name: Upload build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicepacks-build
          path: |
            out/
          retention-days: 14

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'voicepacks-latest' }}
          name: Voice Packs (${{ github.event.inputs.release_tag || 'voicepacks-latest' }})
          body: |
            Voice packs auto-generated by edge-tts.
            Build date: ${{ github.run_id }}
            App: fetch `catalog.json` first, then download only the `.nvb` files needed.
          files: |
            out/catalog.json
            out/**/*.nvb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
