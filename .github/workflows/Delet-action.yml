name: Delete All Previous Builds

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete-runs:
    runs-on: ubuntu-latest

    steps:
      - name: Delete all previous workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "Deleting all previous workflow runs..."

          while true; do
            RUN_IDS=$(gh run list \
              --repo "$REPO" \
              --limit 100 \
              --json databaseId \
              --jq '.[].databaseId')

            if [ -z "$RUN_IDS" ]; then
              echo "All previous workflow runs have been deleted."
              break
            fi

            while read -r RUN_ID; do
              if [ -n "$RUN_ID" ]; then
                echo "Deleting run: $RUN_ID"
                gh run delete "$RUN_ID" --repo "$REPO" || true
              fi
            done <<< "$RUN_IDS"
          done
