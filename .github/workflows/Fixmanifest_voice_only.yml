name: Fix Voice Manifest From Run

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID of build-and-publish-voicepacks to recover assets from'
        required: true
        type: string
      release_tag:
        description: 'Release tag that will receive the recovered assets and manifests'
        required: false
        default: 'voicepacks-latest'
        type: string
      voice_repo:
        description: 'GitHub repository that owns the source run and release'
        required: false
        default: 'abtin123/Make-voice'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  manifest:
    name: Recover voice-pack assets and rebuild manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_REPO: ${{ inputs.voice_repo }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-voicepacks-latest}"

          if ! release_json="$(gh api "repos/$VOICE_REPO/releases/tags/$tag" 2>/dev/null)"; then
            echo "Release $tag does not exist in $VOICE_REPO; creating it."
            gh release create "$tag" \
              --repo "$VOICE_REPO" \
              --title "Voice Packs ($tag)" \
              --notes "Voice packs recovered from workflow run ${{ inputs.source_run_id }}."
            release_json="$(gh api "repos/$VOICE_REPO/releases/tags/$tag")"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r '.id' <<<"$release_json")" >> "$GITHUB_OUTPUT"
          echo "html_url=$(jq -r '.html_url' <<<"$release_json")" >> "$GITHUB_OUTPUT"

      - name: Read existing release assets only
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_REPO: ${{ inputs.voice_repo }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # IMPORTANT: do not download/re-upload any voice files.
          # Read only the assets that already exist in the GitHub Release.
          gh api --paginate "repos/$VOICE_REPO/releases/$RELEASE_ID/assets" \
            --jq '.[]' | jq -s '.' > dist/assets.json

          echo "Existing release assets:"
          jq -r '.[].name' dist/assets.json | sort

          voice_count="$(jq '[.[] | select(.state == "uploaded") | select(.name | test("^[a-z]{2}_(male|female)\\.nvb$"; "i"))] | length' dist/assets.json)"
          if [ "$voice_count" -eq 0 ]; then
            echo "No voice .nvb assets found in the release." >&2
            exit 1
          fi

          echo "Found $voice_count existing voice assets."
          echo "No catalog.json is required; manifest is built only from existing .nvb release assets."

      - name: Build voice-only manifest with language and voice names
        env:
          VOICE_REPO: ${{ inputs.voice_repo }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail

          jq -n \
            --arg repo "$VOICE_REPO" \
            --arg tag "$RELEASE_TAG" \
            --arg release_url "$RELEASE_URL" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --slurpfile assets dist/assets.json '
            def voice_info($name):
              ($name | capture("^(?<lang>[a-z]{2})_(?<gender>male|female)\\.nvb$"; "i")) as $v |
              {
                code: ($v.lang | ascii_downcase),
                language: ({
                  ar:"العربية",
                  de:"Deutsch",
                  en:"English",
                  es:"Español",
                  fa:"فارسی",
                  fr:"Français",
                  ru:"Русский",
                  tr:"Türkçe"
                }[($v.lang | ascii_downcase)] // $v.lang),
                gender: ($v.gender | ascii_downcase),
                voice_name: ({
                  "ar_female":"ليان",
                  "ar_male":"عمر",
                  "de_female":"Anna",
                  "de_male":"Felix",
                  "en_female":"Emma",
                  "en_male":"James",
                  "es_female":"Sofía",
                  "es_male":"Carlos",
                  "fa_female":"بهاره",
                  "fa_male":"آرش",
                  "fr_female":"Claire",
                  "fr_male":"Hugo",
                  "ru_female":"Анна",
                  "ru_male":"Иван",
                  "tr_female":"Elif",
                  "tr_male":"Mert"
                }[$name] // ($v.gender | ascii_upcase))
              };

            {
              schema_version: 2,
              generated_at: (now | todateiso8601),
              repo: $repo,
              release_tag: $tag,
              release_url: $release_url,
              source_run_id: $source_run_id,
              voices: [
                $assets[0][]
                | select(.state == "uploaded")
                | select(.name | test("^[a-z]{2}_(male|female)\\.nvb$"; "i"))
                | (voice_info(.name)) as $v
                | {
                    name: .name,
                    language_code: $v.code,
                    language: $v.language,
                    gender: $v.gender,
                    voice_name: $v.voice_name,
                    size: .size,
                    content_type: .content_type,
                    download_url: .browser_download_url,
                    created_at: .created_at,
                    updated_at: .updated_at
                  }
              ] | sort_by(.language_code, .gender)
            }' > dist/manifest.json

          jq -e '.voices | length > 0' dist/manifest.json >/dev/null
          echo "Generated manifest for $(jq '.voices | length' dist/manifest.json) voices."
          jq . dist/manifest.json

      - name: Replace only manifest.json in release
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_REPO: ${{ inputs.voice_repo }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          # Remove an old manifest only. Never touch any .nvb asset.
          gh api --paginate "repos/$VOICE_REPO/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "manifest.json") | .id' |
          while read -r asset_id; do
            [ -z "$asset_id" ] && continue
            echo "Removing old manifest.json (asset $asset_id)"
            gh api --method DELETE "repos/$VOICE_REPO/releases/assets/$asset_id"
          done

          # Upload exactly one file: manifest.json
          gh release upload "$RELEASE_TAG" dist/manifest.json \
            --repo "$VOICE_REPO"

      - name: Upload manifest as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-voice-manifest
          path: dist/manifest.json
