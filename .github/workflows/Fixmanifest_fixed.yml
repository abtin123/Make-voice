name: Fix Voice Manifest From Run

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Run ID of build-and-publish-voicepacks to recover assets from'
        required: true
        type: string
      release_tag:
        description: 'Release tag that will receive the recovered assets and manifests'
        required: false
        default: 'voicepacks-latest'
        type: string
      voice_repo:
        description: 'GitHub repository that owns the source run and release'
        required: false
        default: 'abtin123/Make-voice'
        type: string

permissions:
  contents: write
  actions: read

jobs:
  manifest:
    name: Recover voice-pack assets and rebuild manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_REPO: ${{ inputs.voice_repo }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-voicepacks-latest}"

          if ! release_json="$(gh api "repos/$VOICE_REPO/releases/tags/$tag" 2>/dev/null)"; then
            echo "Release $tag does not exist in $VOICE_REPO; creating it."
            gh release create "$tag" \
              --repo "$VOICE_REPO" \
              --title "Voice Packs ($tag)" \
              --notes "Voice packs recovered from workflow run ${{ inputs.source_run_id }}."
            release_json="$(gh api "repos/$VOICE_REPO/releases/tags/$tag")"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r '.id' <<<"$release_json")" >> "$GITHUB_OUTPUT"
          echo "html_url=$(jq -r '.html_url' <<<"$release_json")" >> "$GITHUB_OUTPUT"

      - name: Download artifacts from source run
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_REPO: ${{ inputs.voice_repo }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh run download "$SOURCE_RUN_ID" \
            --repo "$VOICE_REPO" \
            --dir downloaded

          echo "Downloaded artifacts:"
          find downloaded -maxdepth 2 -type f | sort

      - name: Rebuild catalog.json from downloaded catalogs
        run: |
          set -euo pipefail
          mapfile -t catalogs < <(find downloaded -type f -name catalog.json | sort)
          if [ "${#catalogs[@]}" -eq 0 ]; then
            echo "No catalog.json files found in downloaded artifacts." >&2
            exit 1
          fi

          python scripts/merge_catalogs.py \
            --inputs "${catalogs[@]}" \
            --out out/catalog.json

      - name: Assemble recovered .nvb assets
        run: |
          set -euo pipefail
          mkdir -p out
          find downloaded -type f -name '*.nvb' -print0 | while IFS= read -r -d '' file; do
            rel="${file#downloaded/}"
            rel="${rel#*/}"
            mkdir -p "out/$(dirname "$rel")"
            cp "$file" "out/$rel"
          done

          nvb_count="$(find out -type f -name '*.nvb' | wc -l | tr -d ' ')"
          if [ "$nvb_count" -eq 0 ]; then
            echo "No .nvb files found in downloaded artifacts." >&2
            exit 1
          fi
          echo "Recovered $nvb_count .nvb files."

      - name: Upload recovered assets and catalog to release
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_REPO: ${{ inputs.voice_repo }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find out -type f \( -name '*.nvb' -o -name catalog.json \) | sort)

          # Delete same-named release assets first. This avoids HTTP 422
          # Validation Failed errors when an asset already exists.
          release_id="$(gh api "repos/$VOICE_REPO/releases/tags/$RELEASE_TAG" --jq '.id')"

          for file in "${files[@]}"; do
            asset_name="$(basename "$file")"
            gh api --paginate "repos/$VOICE_REPO/releases/$release_id/assets"               --jq --arg name "$asset_name" '.[] | select(.name == $name) | .id' |
            while read -r asset_id; do
              if [ -n "$asset_id" ]; then
                echo "Deleting existing release asset: $asset_name (id=$asset_id)"
                gh api --method DELETE "repos/$VOICE_REPO/releases/assets/$asset_id"
              fi
            done
          done

          gh release upload "$RELEASE_TAG" "${files[@]}"             --repo "$VOICE_REPO"

      - name: Build manifest.json from release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_REPO: ${{ inputs.voice_repo }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          RELEASE_URL: ${{ steps.release.outputs.html_url }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh api --paginate "repos/$VOICE_REPO/releases/$RELEASE_ID/assets" > dist/assets.json

          jq -n \
            --arg repo "$VOICE_REPO" \
            --arg tag "$RELEASE_TAG" \
            --arg release_url "$RELEASE_URL" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --slurpfile assets dist/assets.json '
            def language_from_name($name):
              (try ($name | capture("(^|/)(?<lang>[a-z]{2})_(male|female)\\.nvb$"; "i").lang) catch "fa");
            def gender_from_name($name):
              (try ($name | capture("_(?<gender>male|female)\\.nvb$"; "i").gender) catch null);
            {
              schema_version: 1,
              generated_at: (now | todateiso8601),
              repo: $repo,
              release_tag: $tag,
              release_url: $release_url,
              source_run_id: $source_run_id,
              catalog_url: (
                $assets[0][]
                | select(.state == "uploaded" and .name == "catalog.json")
                | .browser_download_url
              ),
              assets: [
                $assets[0][]
                | select(.state == "uploaded")
                | select(.name | test("\\.(nvb|json)$"; "i"))
                | select(.name != "manifest.json")
                | {
                    name: .name,
                    size: .size,
                    content_type: .content_type,
                    download_url: .browser_download_url,
                    created_at: .created_at,
                    updated_at: .updated_at,
                    language: language_from_name(.name),
                    gender: gender_from_name(.name)
                  }
              ]
            }' > dist/manifest.json

          jq -e '.assets | length > 0' dist/manifest.json
          jq . dist/manifest.json

      - name: Upload manifest.json to release
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_REPO: ${{ inputs.voice_repo }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/manifest.json \
            --repo "$VOICE_REPO" \
            --clobber

      - name: Upload rebuilt manifests as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-voice-manifests
          path: |
            out/catalog.json
            dist/manifest.json
