name: build-and-publish-voicepacks

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "مسیر فایل JSON عبارات"
        required: false
        default: "examples/nav_phrases.json"
      genders:
        description: "male female یا فقط یکی"
        required: false
        default: "male female"
      rate:
        description: "نرخ گفتار edge-tts"
        required: false
        default: "+0%"
      release_tag:
        description: "تگ ریلیزی که فایل‌ها روی آن publish می‌شوند"
        required: false
        default: "voicepacks-latest"
      skip_existing:
        required: false
        default: "false"

  push:
    branches: [main]
    paths:
      - "examples/nav_phrases.json"
      - "scripts/**"

permissions:
  contents: write

jobs:
  # هر زبان مستقل build می‌شود؛ خطای گذرای یک زبان (مثل تصادفی بودن یک
  # ولوی خاص در edge-tts) دیگر بقیه‌ی زبان‌ها را متوقف نمی‌کند.
  build:
    strategy:
      fail-fast: false
      matrix:
        lang: [fa, en, ar, tr, de, fr, es, ru]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build ${{ matrix.lang }} voice pack
        working-directory: scripts
        run: |
          ARGS="--input ../${{ github.event.inputs.input_file || 'examples/nav_phrases.json' }}"
          ARGS="$ARGS --out ../out/${{ matrix.lang }}"
          ARGS="$ARGS --languages ${{ matrix.lang }}"
          ARGS="$ARGS --rate \"${{ github.event.inputs.rate || '+0%' }}\""
          ARGS="$ARGS --genders ${{ github.event.inputs.genders || 'male female' }}"
          if [ "${{ github.event.inputs.skip_existing }}" = "true" ]; then
            ARGS="$ARGS --skip-existing"
          fi
          eval python batch.py $ARGS

      - name: Upload ${{ matrix.lang }} build
        uses: actions/upload-artifact@v4
        with:
          name: voicepack-${{ matrix.lang }}
          path: out/${{ matrix.lang }}
          retention-days: 14

  # وقتی همه‌ی زبان‌های موفق build شدند (زبان‌های ناموفق به‌خاطر
  # fail-fast: false نادیده گرفته می‌شوند)، catalogها merge و publish می‌شوند.
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all language builds
        uses: actions/download-artifact@v4
        with:
          pattern: voicepack-*
          path: downloaded

      - name: Assemble output
        run: |
          mkdir -p out
          # فایل‌های .nvb هر زبان را داخل پوشه‌های مشترک هر عبارت ادغام می‌کنیم
          # (نکته: باید محتویات پوشه کپی شود نه خودِ پوشه، وگرنه تو در تو می‌شود)
          for d in downloaded/voicepack-*/; do
            for phrase_dir in "$d"*/; do
              [ -d "$phrase_dir" ] || continue
              name=$(basename "$phrase_dir")
              mkdir -p "out/$name"
              cp -r "$phrase_dir"/. "out/$name/"
            done
          done
          python scripts/merge_catalogs.py \
            --inputs downloaded/voicepack-*/catalog.json \
            --out out/catalog.json

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'voicepacks-latest' }}
          name: Voice Packs (${{ github.event.inputs.release_tag || 'voicepacks-latest' }})
          body: |
            Voice packs auto-generated by edge-tts, built per-language.
            Build run: ${{ github.run_id }}
          files: |
            out/catalog.json
            out/**/*.nvb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
